name: Cloud deployment CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "cloud-deployment/**"
      - ".github/workflows/cloud-deployment.yml"

  push:
    branches:
      - main
    paths:
      - "cloud-deployment/**"
      - ".github/workflows/cloud-deployment.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  DEPLOYMENT_DIRECTORY: cloud-deployment

jobs:
  test:
    name: Test FastAPI application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloud-deployment

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            cloud-deployment/requirements.txt
            cloud-deployment/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify deployment files
        run: |
          pwd
          find . -maxdepth 3 -type f | sort

      - name: Verify application import
        env:
          PYTHONPATH: .
        run: python -c "from app.main import app; print(app.title)"

      - name: Run automated tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -v
  build-and-deploy:
    name: Build and deploy Cloud Run
    runs-on: ubuntu-latest
    needs: test

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Define container image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build container image
        run: |
          docker build \
            --tag "$IMAGE" \
            "$DEPLOYMENT_DIRECTORY"

      - name: Push container image
        run: docker push "$IMAGE"

      - name: Deploy Cloud Run revision
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --memory="1Gi" \
            --cpu="1" \
            --min-instances="0" \
            --max-instances="3" \
            --no-allow-unauthenticated \
            --quiet

      - name: Read service URL
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format="value(status.url)")

          test -n "$SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Check health endpoint
        run: |
          TOKEN=$(gcloud auth print-identity-token)

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 6 \
            --retry-delay 5 \
            -H "Authorization: Bearer $TOKEN" \
            "${SERVICE_URL}/health"

      - name: Check model-info endpoint
        run: |
          TOKEN=$(gcloud auth print-identity-token)

          curl \
            --fail \
            --show-error \
            --silent \
            -H "Authorization: Bearer $TOKEN" \
            "${SERVICE_URL}/model-info"
